services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?set REVIEW_DB_PASSWORD}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]
    volumes: [zookeeper_data:/var/lib/zookeeper/data, zookeeper_log:/var/lib/zookeeper/log]
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
      interval: 15s
      timeout: 10s
      retries: 10
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      zookeeper: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT for clients on the host (localhost:9092); INTERNAL for containers and kind pods (kafka:29092).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # One public issuer for every token, whichever address fetched it (host: localhost, containers: keycloak).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:?set ADMIN_USER_PASSWORD}
      CUSTOMER_USER_PASSWORD: ${CUSTOMER_USER_PASSWORD:?set CUSTOMER_USER_PASSWORD}
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?set GATEWAY_CLIENT_SECRET}
      ORDER_CLIENT_SECRET: ${ORDER_CLIENT_SECRET:?set ORDER_CLIENT_SECRET}
      PAYMENT_OPERATOR_CLIENT_SECRET: ${PAYMENT_OPERATOR_CLIENT_SECRET:?set PAYMENT_OPERATOR_CLIENT_SECRET}
    ports: ["8180:8180"]
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
  zipkin:
    image: openzipkin/zipkin:3.5.1
    # In-memory storage: the image default (160 MB heap, 500k spans) runs out of memory under load; cap spans, raise heap (L5).
    environment:
      MEM_MAX_SPANS: "100000"
      JAVA_OPTS: -Xms256m -Xmx768m -XX:+ExitOnOutOfMemoryError
    ports: ["9411:9411"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9411/health"]
      interval: 15s
      timeout: 5s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- platform applications (NFR-08)
  # Only the Gateway publishes a port: business services stay on the Compose network (PLAN, ADD §7).
  config-server:
    image: ecommerce/config-server:local
    build: {context: ../.., dockerfile: platform/config-server/Dockerfile}
    environment: *app-env
    healthcheck: *app-health-8888
  eureka-server:
    image: ecommerce/eureka-server:local
    build: {context: ../.., dockerfile: platform/eureka-server/Dockerfile}
    environment: *app-env
    depends_on: {config-server: {condition: service_healthy}}
    healthcheck: *app-health-8761
  api-gateway:
    image: ecommerce/api-gateway:local
    build: {context: ../.., dockerfile: platform/api-gateway/Dockerfile}
    environment:
      <<: *app-env
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET}
      # ADD §7 defaults; k6/stress-products.js raises the anonymous limit so it measures the platform, not the limiter.
      GATEWAY_ANON_REPLENISH_RATE: ${GATEWAY_ANON_REPLENISH_RATE:-100}
      GATEWAY_ANON_BURST: ${GATEWAY_ANON_BURST:-200}
    ports: ["8080:8080"]
    depends_on: &platform-ready
      eureka-server: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: *app-health-8090
  product-service:
    image: ecommerce/product-service:local
    build: {context: ../.., dockerfile: services/product-service/Dockerfile}
    environment:
      <<: *app-env
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
    depends_on: *platform-ready
    healthcheck: *app-health-8081
  inventory-service:
    image: ecommerce/inventory-service:local
    build: {context: ../.., dockerfile: services/inventory-service/Dockerfile}
    environment:
      <<: *app-env
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    depends_on: &saga-ready
      eureka-server: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck: *app-health-8084
  payment-service:
    image: ecommerce/payment-service:local
    build: {context: ../.., dockerfile: services/payment-service/Dockerfile}
    environment:
      <<: *app-env
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.0}
    depends_on: *saga-ready
    healthcheck: *app-health-8083
  order-service:
    image: ecommerce/order-service:local
    build: {context: ../.., dockerfile: services/order-service/Dockerfile}
    environment:
      <<: *app-env
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      ORDER_CLIENT_SECRET: ${ORDER_CLIENT_SECRET}
    depends_on: *saga-ready
    healthcheck: *app-health-8082
  notification-service:
    image: ecommerce/notification-service:local
    build: {context: ../.., dockerfile: services/notification-service/Dockerfile}
    environment:
      <<: *app-env
      NOTIFICATION_FAIL: ${NOTIFICATION_FAIL:-false}
    depends_on: *saga-ready
    healthcheck: *app-health-8085
  review-service:
    image: ecommerce/review-service:local
    build: {context: ../.., dockerfile: services/review-service/Dockerfile}
    environment:
      <<: *app-env
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD}
    depends_on: *saga-ready
    healthcheck: *app-health-8086

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  redis_data:
  keycloak_data:
  prometheus_data:
  grafana_data:
