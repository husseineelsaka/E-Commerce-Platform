x-app-env: &app-env
  # How every application finds the platform inside the Compose network.
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce-platform
  KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URI: http://keycloak:8180/realms/ecommerce-platform/protocol/openid-connect/token
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  # NFR-06: JSON (ECS) console logs; every line carries trace.id and span.id.
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  PRODUCT_DB_HOST: postgres
  INVENTORY_DB_HOST: postgres
  PAYMENT_DB_HOST: postgres
  ORDER_DB_HOST: postgres
  REVIEW_DB_HOST: postgres
x-app-health-8888: &app-health-8888
  test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8888/actuator/health"]
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 40s
