global:
  scrape_interval: 15s
scrape_configs:
  # The applications as they run in Docker Compose (service name : management port).
  - job_name: spring-apps
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8888
          - eureka-server:8761
          - api-gateway:8090
          - product-service:8081
          - order-service:8082
          - payment-service:8083
          - inventory-service:8084
          - notification-service:8085
    relabel_configs:
      # application label = service name, so dashboards can group by service.
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: application
