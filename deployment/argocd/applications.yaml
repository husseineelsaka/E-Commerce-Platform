# One ArgoCD Application per service (handbook default: automated, selfHeal, prune).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/husseineelsaka/E-Commerce-Platform.git
    targetRevision: main
    path: deployment/helm/config-server
    helm:
      # kind runs the locally built images loaded by deployment/kubernetes/up.sh; a registry-based cluster would
      # use ghcr.io/husseineelsaka/config-server with the commit-SHA tag pushed by CI.
      valuesObject:
        image: {repository: ecommerce/config-server, tag: local, pullPolicy: Never}
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
