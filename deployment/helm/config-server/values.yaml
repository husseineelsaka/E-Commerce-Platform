replicas: 1
image:
  # CI pushes ghcr.io/<owner>/config-server:<commit sha>; the kind setup loads the locally built image instead.
  repository: ghcr.io/husseineelsaka/config-server
  tag: latest
  pullPolicy: IfNotPresent
port: 8888
managementPort: 8888
service:
  type: ClusterIP
  nodePort: null
# Kubernetes Secret created from deployment/docker/.env (never committed); see deployment/kubernetes/README.md.
secretName: ecommerce-secrets
secretEnv: []
env:
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 768Mi}
