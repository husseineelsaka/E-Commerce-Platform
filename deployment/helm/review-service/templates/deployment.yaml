apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels: {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
            {{- if ne (int .Values.managementPort) (int .Values.port) }}
            - {name: management, containerPort: {{ .Values.managementPort }}}
            {{- end }}
          env:
            {{- range $name, $value := .Values.env }}
            - {name: {{ $name }}, value: {{ $value | quote }}}
            {{- end }}
            {{- range .Values.secretEnv }}
            - name: {{ . }}
              valueFrom: {secretKeyRef: {name: {{ $.Values.secretName }}, key: {{ . }}}}
            {{- end }}
          # Spring Boot enables the liveness/readiness health groups when it detects Kubernetes.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: {{ .Values.managementPort }}}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: {{ .Values.managementPort }}}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: {{ .Values.managementPort }}}
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
