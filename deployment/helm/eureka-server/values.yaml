replicas: 1
image:
  # CI pushes ghcr.io/<owner>/eureka-server:<commit sha>; the kind setup loads the locally built image instead.
  repository: ghcr.io/husseineelsaka/eureka-server
  tag: latest
  pullPolicy: IfNotPresent
port: 8761
managementPort: 8761
service:
  type: ClusterIP
  nodePort: null
# Kubernetes Secret created from deployment/docker/.env (never committed); see deployment/kubernetes/README.md.
secretName: ecommerce-secrets
secretEnv: []
env:
  CONFIG_SERVER_URL: "http://config-server:8888"
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 768Mi}
