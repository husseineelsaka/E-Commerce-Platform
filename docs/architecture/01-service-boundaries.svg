<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="32" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2937">Drawing 1 — B1 service boundaries (Team 1)</text>

  <!-- customer and gateway -->
  <rect x="470" y="72" width="200" height="38" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="570" y="96" text-anchor="middle" font-weight="600">Customer / Admin</text>
  <rect x="420" y="150" width="300" height="50" rx="8" fill="#eef4fb" stroke="#336791" stroke-width="2"/>
  <text x="570" y="172" text-anchor="middle" font-weight="600">api-gateway :8080</text>
  <text x="570" y="190" text-anchor="middle" font-size="12" fill="#6b7280">JWT check · roles · rate limit · new review route</text>
  <line x1="570" y1="110" x2="570" y2="148" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- existing services -->
  <g text-anchor="middle">
    <rect x="30" y="270" width="160" height="56" rx="8" fill="#eef4fb" stroke="#336791"/><text x="110" y="294" font-weight="600">product :8081</text><text x="110" y="313" font-size="12" fill="#b45309">+ rating consumer</text>
    <rect x="210" y="270" width="160" height="56" rx="8" fill="#eef4fb" stroke="#336791"/><text x="290" y="302" font-weight="600">order :8082</text>
    <rect x="390" y="270" width="160" height="56" rx="8" fill="#eef4fb" stroke="#336791"/><text x="470" y="302" font-weight="600">inventory :8084</text>
    <rect x="570" y="270" width="160" height="56" rx="8" fill="#eef4fb" stroke="#336791"/><text x="650" y="302" font-weight="600">payment :8083</text>
    <rect x="750" y="270" width="160" height="56" rx="8" fill="#eef4fb" stroke="#336791"/><text x="830" y="302" font-weight="600">notification :8085</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="470" y1="200" x2="130" y2="268"/>
    <line x1="510" y1="200" x2="300" y2="268"/>
    <line x1="545" y1="200" x2="475" y2="268"/>
  </g>

  <!-- kafka -->
  <rect x="30" y="400" width="880" height="44" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="427" font-weight="600" fill="#1f2937">Kafka :9092 — order-events · inventory-events · payment-events · <tspan fill="#b45309">review-events (new)</tspan></text>

  <!-- product_db -->
  <rect x="30" y="500" width="240" height="120" rx="8" fill="#fff" stroke="#336791"/>
  <text x="44" y="522" font-weight="600">product_db</text>
  <text x="44" y="546">category, product</text>
  <text x="44" y="568" fill="#b45309" font-weight="600">product_rating (count, sum)</text>
  <text x="44" y="590" fill="#b45309">processed_event (dedup)</text>
  <line x1="110" y1="326" x2="110" y2="498" stroke="#336791" stroke-width="1.2"/>

  <!-- review boundary -->
  <rect x="950" y="130" width="230" height="500" rx="14" fill="#fffaf2" stroke="#b45309" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="1065" y="156" text-anchor="middle" font-weight="600" fill="#b45309">review-service boundary</text>
  <rect x="980" y="270" width="170" height="56" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="2"/>
  <text x="1065" y="294" text-anchor="middle" font-weight="600">review-service :8086</text>
  <text x="1065" y="313" text-anchor="middle" font-size="12" fill="#6b7280">submit · paginated read</text>
  <rect x="980" y="500" width="170" height="80" rx="8" fill="#fff" stroke="#b45309"/>
  <text x="994" y="522" font-weight="600">review_db</text>
  <text x="994" y="544">review (UNIQUE</text>
  <text x="994" y="562">product_id, customer_id)</text>
  <line x1="1065" y1="326" x2="1065" y2="498" stroke="#b45309" stroke-width="1.2"/>
  <text x="994" y="606" font-size="12">+ outbox_event</text>

  <!-- B1 arrows -->
  <path d="M720,175 C860,175 1000,200 1050,268" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
  <text x="780" y="168" fill="#b45309" font-weight="600">submit / read reviews</text>
  <path d="M1000,326 C960,380 940,410 912,420" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
  <text x="925" y="372" fill="#b45309" font-weight="600" text-anchor="end">ReviewSubmitted</text>
  <path d="M60,400 C60,370 80,345 95,328" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
  <text x="200" y="378" fill="#b45309">ReviewSubmitted → update rating (idempotent)</text>

  <!-- owns / does not own -->
  <rect x="300" y="480" width="610" height="150" rx="10" fill="#fafafa" stroke="#d1d5db"/>
  <text x="316" y="504" font-weight="600" fill="#1f2937">review-service owns</text>
  <text x="316" y="526">• reviews: product, customer, rating 1–5, text</text>
  <text x="316" y="546">• the rule "one review per customer per product"</text>
  <text x="316" y="566">• the ReviewSubmitted event</text>
  <text x="660" y="504" font-weight="600" fill="#1f2937">does NOT own</text>
  <text x="660" y="526">• products, prices, categories (Product)</text>
  <text x="660" y="546">• orders / purchases (Order)</text>
  <text x="660" y="566">• customer identity (Keycloak)</text>
  <text x="316" y="604" font-size="12" fill="#6b7280">No call to Product on submit (ADD §2). Product skips events for unknown product IDs.</text>

  <text x="30" y="700" font-size="12" fill="#6b7280">Also touched for B1: Keycloak (review-service audience) · Postgres init (review_db) · config-repo · Prometheus target · Helm chart, CI pipeline, ArgoCD Application</text>
</svg>
