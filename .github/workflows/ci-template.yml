name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
  # L4 template: enable this job after GHCR permissions and image policy are agreed.
  build-and-push-template:
    if: false
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - run: echo "L4 builds each app from repo-root context and pushes ghcr.io/<owner>/<app>:${GITHUB_SHA}"
