gateway:
  rate-limit:
    # ADD §7 limits. The stress test raises the anonymous rate (GATEWAY_ANON_REPLENISH_RATE / _BURST) so it measures
    # the platform, not the limiter.
    anonymous:
      replenish-rate: ${GATEWAY_ANON_REPLENISH_RATE:100}
      burst-capacity: ${GATEWAY_ANON_BURST:200}
    signed-in:
      replenish-rate: ${GATEWAY_USER_REPLENISH_RATE:20}
      burst-capacity: ${GATEWAY_USER_BURST:40}
    trusted-proxies: []
  cors:
    # Swagger UI from docs/api, started by Docker Compose on port 8089.
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:8089}
