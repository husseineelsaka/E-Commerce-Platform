eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # NFR-06: every request and every Kafka message is traced (W3C traceparent) and reported to Zipkin.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
spring:
  kafka:
    # Kafka producer and consumer spans join the trace; the traceparent travels in the record headers.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
