eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Latency histograms so Prometheus/Grafana can compute P95 per service (NFR-02).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # L5 bottleneck fix: Spring Security wrapped every filter chain, authentication and authorization step in its own
  # observation (9 of the 12 spans of one anonymous product read). Requests, Feign calls and Kafka stay traced.
  observations:
    enable:
      spring.security: false
      # The outbox pollers run every 500 ms; observing each run started a new trace twice a second per service and
      # buried real traces in Zipkin. The relay still opens its own span inside each event's original trace.
      tasks.scheduled: false
  # NFR-06: every request and every Kafka message is traced (W3C traceparent) and reported to Zipkin.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
spring:
  kafka:
    # Kafka producer and consumer spans join the trace; the traceparent travels in the record headers.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
