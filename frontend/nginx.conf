# Storefront: serves the static web UI and proxies the two backends it needs, so the browser talks to ONE origin
# (http://localhost:8070) and no CORS rule has to change on the Gateway or Keycloak.
server {
    listen 8070;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, re-resolved every 10 s, so a restarted container (new IP) is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;
    set $keycloak http://keycloak:8180;

    # Business API -> the API Gateway, the platform's only public entry (ADD §7).
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Sign-in -> Keycloak (/auth/realms/... -> /realms/...). Tokens keep the issuer http://localhost:8180/...
    # because Keycloak runs with KC_HOSTNAME, so the Gateway accepts them.
    location /auth/ {
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $keycloak;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
    }

    # Read-only views for the guided tour (/tour/). Kept narrow on purpose: one config document, the Eureka registry,
    # Zipkin trace search and the Prometheus query API. GET only.
    set $config http://config-server:8888;
    set $eureka http://eureka-server:8761;
    set $zipkin http://zipkin:9411;
    set $prometheus http://prometheus:9090;

    location = /tour-api/config/order-service/default {
        limit_except GET { deny all; }
        proxy_pass $config/order-service/default;
    }
    location = /tour-api/eureka/apps {
        limit_except GET { deny all; }
        proxy_set_header Accept application/json;
        proxy_pass $eureka/eureka/apps;
    }
    location = /tour-api/zipkin/api/v2/traces {
        limit_except GET { deny all; }
        proxy_pass $zipkin/api/v2/traces$is_args$args;
    }
    location = /tour-api/prometheus/api/v1/query {
        limit_except GET { deny all; }
        proxy_pass $prometheus/api/v1/query$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
