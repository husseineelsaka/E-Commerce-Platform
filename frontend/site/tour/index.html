<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Team 1 Guided Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="tour.css">
</head>
<body>
<!--BODY-->
<div class="app">
  <header class="top">
    <div class="brand">Team 1 · Guided tour<small>E-Commerce Platform</small></div>
    <nav class="chapters" aria-label="Chapters">
      <button class="chip" data-chapter="why">1 · Why microservices</button>
      <button class="chip" data-chapter="course">2 · Sessions S0–S24</button>
      <button class="chip" data-chapter="live">3 · Live platform</button>
    </nav>
    <span id="mode" class="mode">Checking for the platform…</span>
    <label id="pw-row" hidden>customer-test password
      <input id="pw" type="password" autocomplete="off" placeholder="from deployment/docker/.env">
    </label>
    <button id="toolwin" class="chip" hidden title="Opens one extra window; each tool step loads its page there. Put it on the projector screen.">Open tool window</button>
  </header>

  <div class="main">
    <aside id="nav" aria-label="All steps"></aside>
    <article id="stage" aria-live="polite"></article>
  </div>

  <footer class="transport">
    <div class="bar"><div id="progress"></div></div>
    <p id="caption"></p>
    <div class="controls">
      <button id="prev" class="btn" title="Previous (←)">Back</button>
      <button id="play" class="btn primary" aria-pressed="false" title="Play / pause (space)">Play</button>
      <button id="next" class="btn" title="Next (→)">Next</button>
      <span id="count"></span>
      <select id="jump" aria-label="Go to step"></select>
      <label class="spacer"><input id="auto" type="checkbox" checked> Auto-advance</label>
      <label>Speed
        <select id="rate"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
      </label>
      <label>Voice <select id="voice"></select></label>
    </div>
  </footer>
</div>
<!--/BODY-->
<script src="tour-data.js"></script>
<script src="tour.js"></script>
</body>
</html>
